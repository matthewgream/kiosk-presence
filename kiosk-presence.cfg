# kiosk-presence -- blank the kiosk screen when the webcam sees no motion.
# Restart to apply: systemctl restart kiosk-presence

# camera and the cage output to switch
device=/dev/video0
output=DP-1

# frames analysed per second (the camera runs at 15)
analyse-per-second=2

# motion = more than `threshold` % of the picture's 4x4-pixel blocks changed by more than
# `block-delta` (0-255 brightness), after removing any change common to the whole picture.
# Measured 2026-10-08: someone keeping still at the desk gives blips of 2-11% every few seconds;
# the quietest stretches read 0.0-0.8%.
threshold=1.5
block-delta=12

# seconds with no motion before the screen goes off (longest quiet stretch seen at the desk ~25s)
idle=300

# seconds to ignore the camera after switching, so the screen's own light change is not motion
settle=5
